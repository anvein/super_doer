included:
  - SuperDoer

excluded:
  - SuperDoer/Resources
  - SuperDoer/Config

disabled_rules:
  - todo
  - closure_parameter_position
  - for_where

opt_in_rules:
  - closure_spacing
  - discouraged_direct_init
  - multiline_arguments
  - multiline_parameters
  - redundant_nil_coalescing
  - trailing_whitespace
  - redundant_type_annotation
  - operator_usage_whitespace
  - blanket_disable_command
  - closure_body_length
  - closure_end_indentation
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discarded_notification_center_observer
  - discouraged_assert
  - empty_collection_literal
  - empty_count
  - enum_case_associated_values_count
  - file_name
  - file_name_no_space
  - implicitly_unwrapped_optional
  - modifier_order
  #perfomance
  - flatmap_over_map_reduce
  - first_where

# - force_unwrapping # активировать
# - balanced_xctest_lifecycle # попробовать с XCTests
# - empty_xctest_method


#analyzer_rules:
#  - capture_variable  

# Настройки отдельных правил
line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

type_name:
  min_length: 3
  max_length: 40
  allowed_symbols: ["_"]

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - r

cyclomatic_complexity:
  ignores_case_statements: true
  warning: 15
  error: 30

trailing_comma:
  mandatory_comma: true

file_length:
  warning: 800
  error: 1200

large_tuple:
  warning: 3
  error: 5

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 7
  error: 8
  ignores_default_parameters: true

force_cast: error
force_try: error

reporter: "xcode"
